<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search results - guestbridgerwanda</title>
<meta name="description" content="Compare available hotels and filter by price, guest rating, stars and features.">
<meta name="author" content="Batsinda Keynes Benoit">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="style.css">

<script src="API_Key.js"></script>
<script src="config.js"></script>
<script src="search-service.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="ui.js"></script>
<script src="auth.js"></script>

<style>
    /* ---- bar showing the current search ---- */
    .search-summary {
        background: var(--box-bg);
        border-bottom: 1px solid var(--line);
    }

    .summary-row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 12px 0;
    }

    .summary-facts {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        flex: 1;
        min-width: 0;
    }

    .summary-facts > span {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
    }

    .summary-facts svg {
        width: 15px;
        height: 15px;
        color: var(--blue);
        flex-shrink: 0;
    }

    .summary-city {
        font-size: 17px;
        font-weight: 700;
    }

    /* form that opens when you click "Change search" */
    .change-form {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: end;
        padding: 14px 0 18px;
        border-top: 1px solid var(--line);
    }

    .change-form .btn {
        height: 38px;
    }

    /* ---- page layout: filters on the left, results on the right ---- */
    .results-layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
        padding: 24px 0;
    }

    /* ---- filters ---- */
    .filter-group {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
    }

    .filter-group:first-child {
        padding-top: 0;
    }

    .filter-group:last-child {
        padding-bottom: 0;
        border-bottom: none;
    }

    .filter-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .price-readout {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    input[type="range"] {
        width: 100%;
        accent-color: var(--blue);
        cursor: pointer;
    }

    /* ---- toolbar above the results ---- */
    .results-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    .results-count {
        font-size: 20px;
    }

    .results-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .filter-btn {
        display: none;
    }

    .tag-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    /* ---- one hotel in the results list ---- */
    .results-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .result {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr) 190px;
    }

    .result-photo {
        position: relative;
        background: var(--box-bg-2);
    }

    .result-photo img {
        width: 100%;
        height: 100%;
        min-height: 190px;
        object-fit: cover;
    }

    .result-info {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
    }

    .result-name {
        font-size: 17px;
        font-weight: 600;
    }

    .result-name a {
        color: var(--text);
    }

    .result-name a:hover {
        color: var(--blue);
    }

    .result-room {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-light);
    }

    .result-room svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
    }

    .result-features {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: auto;
        padding-top: 10px;
    }

    .result-side {
        padding: 16px;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        text-align: right;
    }

    .result-rating {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .result-rating strong {
        display: block;
        font-size: 13px;
    }

    /* the review count sits under the rating word; the score badge keeps its own colours */
    .result-rating div span {
        font-size: 12px;
        color: var(--text-light);
    }

    /* ---- grid view ---- */
    .results-list.grid-view {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
    }

    .results-list.grid-view .result {
        grid-template-columns: 1fr;
    }

    .results-list.grid-view .result-photo img {
        min-height: 0;
        aspect-ratio: 4 / 3;
    }

    .results-list.grid-view .result-side {
        border-left: none;
        border-top: 1px solid var(--line);
        flex-direction: row;
        align-items: flex-end;
        text-align: left;
    }

    .results-list.grid-view .result-features {
        margin-top: 6px;
        padding-top: 0;
    }

    .more-row {
        display: flex;
        justify-content: center;
        padding-top: 20px;
    }

    /* ---- responsive ---- */
    @media (max-width: 1000px) {
        .results-layout {
            grid-template-columns: 1fr;
        }

        .filter-side {
            display: none;
        }

        .filter-btn {
            display: inline-flex;
        }

        .change-form {
            grid-template-columns: 1fr 1fr;
        }

        .change-form > *:first-child,
        .change-form > .btn {
            grid-column: 1 / -1;
        }
    }

    @media (max-width: 800px) {
        .result {
            grid-template-columns: 170px minmax(0, 1fr);
        }

        .result-side {
            grid-column: 1 / -1;
            border-left: none;
            border-top: 1px solid var(--line);
            flex-direction: row;
            align-items: center;
            text-align: left;
        }
    }

    @media (max-width: 560px) {
        .result {
            grid-template-columns: 1fr;
        }

        .result-photo img {
            min-height: 0;
            aspect-ratio: 16 / 10;
        }

        .result-side {
            flex-direction: column;
            align-items: stretch;
        }

        .result-side .price {
            text-align: left;
        }

        .change-form {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>

<!-- ===== current search + change search form ===== -->
<div class="search-summary">
    <div class="page">
        <div class="summary-row">
            <a href="index.html" class="btn btn-plain btn-small">&larr; Home</a>

            <div class="summary-facts">
                <span class="summary-city" id="summary-city">Loading...</span>

                        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script>
(function () {
    'use strict';

    const searchService = new SearchService();

    const criteria = UI.search.fromQuery();
    let allHotels = [];
    let shownHotels = [];
    const PAGE_SIZE = 10;
    let visibleCount = PAGE_SIZE;

    const filters = {
        stars: new Set(),
        minRating: 0,
        features: new Set(),
        maxPrice: null,
        name: ''
    };

    let cheapest = 0;
    let dearest = 1000;

    // The API does not give a features list, so we look for these phrases in
    // accessibilityLabel, which is the long text description of each hotel.
    const FEATURES = [
        { key: 'breakfast',  label: 'Breakfast included', icon: 'coffee', words: ['breakfast included'] },
        { key: 'cancel',     label: 'Free cancellation',  icon: 'shield', words: ['free cancellation'] },
        { key: 'noprepay',   label: 'No prepayment',      icon: 'tag',    words: ['no prepayment'] },
        { key: 'preferred',  label: 'Preferred hotel',    icon: 'star',   words: ['preferred property', 'preferred plus property'] },
        { key: 'mobile',     label: 'Mobile-only price',  icon: 'tag',    words: ['mobile-only price'] },
        { key: 'taxes',      label: 'Taxes included',     icon: 'check',  words: ['includes taxes'] }
    ];

    /* ---------- reading fields out of one API hotel ---------- */
    function priceOf(item) {
        const prices = item.property && item.property.priceBreakdown;
        return prices && prices.grossPrice ? Number(prices.grossPrice.value) || 0 : 0;
    }

    function oldPriceOf(item) {
        const prices = item.property && item.property.priceBreakdown;
        const value = prices && prices.strikethroughPrice ? Number(prices.strikethroughPrice.value) : 0;
        return value > priceOf(item) ? value : 0;
    }

    function currencyOf(item) {
        const prices = item.property && item.property.priceBreakdown;
        return (prices && prices.grossPrice && prices.grossPrice.currency) || 'USD';
    }

    function starsOf(item) {
        const hotel = item.property || {};
        return Math.round(Number(hotel.accuratePropertyClass || hotel.propertyClass) || 0);
    }

    function ratingOf(item) {
        return Number((item.property || {}).reviewScore) || 0;
    }

    function featuresOf(item) {
        const text = String(item.accessibilityLabel || '').toLowerCase();
        return FEATURES.filter(feature => feature.words.some(word => text.includes(word)));
    }

    // accessibilityLabel is a few lines of text, for example:
    //   "Hotel name.\n4 out of 5 stars.\n8.6 Very good 485 reviews.\n0.5 km from centre.\nHotel room : 1 bed."
    // We pull out the distance and the room description instead of printing it all.
    function detailsOf(item) {
        const lines = String(item.accessibilityLabel || '')
            .replace(/[‎‬‪]/g, '')
            .split('\n')
            .map(line => line.trim())
            .filter(Boolean);

        let distance = '';
        let room = '';

        lines.forEach(line => {
            const distanceMatch = line.match(/^([\d.]+\s*(?:km|m))\s+from\s+(.+?)\.?$/i);
            if (distanceMatch) distance = `${distanceMatch[1]} from ${distanceMatch[2]}`;

            const roomMatch = line.match(/^(.+?)\s*:\s*(.+?)\.?$/);
            if (roomMatch && /room|apartment|suite|studio|villa|dorm|bungalow|chalet/i.test(roomMatch[1])) {
                room = `${roomMatch[1].trim()}, ${roomMatch[2].replace(/Beds:\s*/i, '').trim()}`;
            }
        });

        return { distance, room };
    }

    function detailsLink(item) {
        const query = UI.search.toQuery({
            hotel_id: (item.property && item.property.id) || item.hotel_id,
            dest_id: criteria.dest_id,
            destination: criteria.destination
        });
        return `Details.html?${query.toString()}`;
    }

    /* ---------- filter panel ---------- */
    // The same controls appear in the sidebar and in the popup. Both panels get the
    // same HTML apart from `side`, which keeps their ids and radio group names apart.
    function filterHtml(side) {
        const starTotals = {};
        const featureTotals = {};
        allHotels.forEach(item => {
            const stars = starsOf(item);
            if (stars > 0) starTotals[stars] = (starTotals[stars] || 0) + 1;
            featuresOf(item).forEach(feature => {
                featureTotals[feature.key] = (featureTotals[feature.key] || 0) + 1;
            });
        });

        const ratingChoices = [
            { value: 9, label: 'Excellent 9+' },
            { value: 8, label: 'Very good 8+' },
            { value: 7, label: 'Good 7+' },
            { value: 6, label: 'Fair 6+' }
        ];

        return `
            <div class="filter-group">
                <div class="filter-head">
                    <span>Filters</span>
                    <button class="btn btn-plain btn-small" type="button" data-reset>Reset</button>
                </div>
                <label class="sr-only" for="name-filter-${side}">Search hotel names</label>
                <div class="search-field">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                    <input type="search" class="name-filter" id="name-filter-${side}" placeholder="Hotel name" value="${UI.escapeHtml(filters.name)}">
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-head"><span>Price per night</span></div>
                <div class="price-readout">
                    <span>${UI.money(cheapest)}</span>
                    <span class="price-label">Up to ${UI.money(filters.maxPrice === null ? dearest : filters.maxPrice)}</span>
                </div>
                <input type="range" class="price-filter"
                       min="${Math.floor(cheapest)}" max="${Math.ceil(dearest)}" step="5"
                       value="${filters.maxPrice === null ? Math.ceil(dearest) : filters.maxPrice}"
                       aria-label="Maximum price per night">
            </div>

            <div class="filter-group">
                <div class="filter-head"><span>Guest rating</span></div>
                ${ratingChoices.map(choice => {
                    const total = allHotels.filter(item => ratingOf(item) >= choice.value).length;
                    return `
                        <label class="check">
                            <input type="radio" name="rating-${side}" value="${choice.value}"
                                   ${filters.minRating === choice.value ? 'checked' : ''} ${total ? '' : 'disabled'}>
                            <span class="check-text">${choice.label}</span>
                            <span class="check-count">${total}</span>
                        </label>`;
                }).join('')}
            </div>

            <div class="filter-group">
                <div class="filter-head"><span>Stars</span></div>
                ${[5, 4, 3, 2, 1].map(stars => {
                    const total = starTotals[stars] || 0;
                    return `
                        <label class="check">
                            <input type="checkbox" data-star="${stars}" ${filters.stars.has(stars) ? 'checked' : ''} ${total ? '' : 'disabled'}>
                            <span class="check-text">
                                <span class="stars">${'★'.repeat(stars)}</span>
                                <span class="small muted">${stars} star</span>
                            </span>
                            <span class="check-count">${total}</span>
                        </label>`;
                }).join('')}
            </div>

            <div class="filter-group">
                <div class="filter-head"><span>Features</span></div>
                ${FEATURES.map(feature => {
                    const total = featureTotals[feature.key] || 0;
                    if (!total) return '';
                    return `
                        <label class="check">
                            <input type="checkbox" data-feature="${feature.key}" ${filters.features.has(feature.key) ? 'checked' : ''}>
                            <span class="check-text">${UI.escapeHtml(feature.label)}</span>
                            <span class="check-count">${total}</span>
                        </label>`;
                }).join('') || '<p class="small muted">No feature information for these hotels.</p>'}
            </div>`;
    }

    function drawFilters() {
        document.getElementById('filters').innerHTML = filterHtml('side');
        document.getElementById('filters-popup').innerHTML = filterHtml('popup');
    }

    /* ---------- one result row ---------- */
    function resultHtml(item) {
        const hotel = item.property || {};
        const price = priceOf(item);
        const oldPrice = oldPriceOf(item);
        const currency = currencyOf(item);
        const stars = starsOf(item);
        const rating = ratingOf(item);
        const photo = (hotel.photoUrls && hotel.photoUrls[0]) || UI.NO_PHOTO;
        const features = featuresOf(item).slice(0, 4);
        const extra = detailsOf(item);
        const link = detailsLink(item);
        const nights = UI.countNights(criteria.checkin, criteria.checkout) || 1;
        const off = oldPrice ? Math.round(((oldPrice - price) / oldPrice) * 100) : 0;

        const saveData = UI.escapeHtml(JSON.stringify({
            id: hotel.id || item.hotel_id,
            name: hotel.name || 'Hotel',
            city: hotel.wishlistName || criteria.destination || '',
            photo: (hotel.photoUrls && hotel.photoUrls[0]) || '',
            price: price
        }));

        return `
            <article class="box result">
                <div class="result-photo">
                    <div class="photo-labels">
                        ${off >= 5 ? `<span class="label label-deal">${off}% off</span>` : ''}
                    </div>
                    <button class="save-btn" type="button" data-save="${saveData}" aria-pressed="false" aria-label="Save this hotel">
                        ${UI.icon('heart')}
                    </button>
                    <a href="${link}" tabindex="-1" aria-hidden="true">
                        <img src="${UI.escapeHtml(photo)}" alt="" loading="lazy" onerror="UI.usePlaceholder(this)">
                    </a>
                </div>

                <div class="result-info">
                    ${stars > 0 ? `<div class="stars" aria-label="${stars} star hotel">${'★'.repeat(stars)}</div>` : ''}
                    <h2 class="result-name"><a href="${link}">${UI.escapeHtml(hotel.name || 'Hotel')}</a></h2>
                    <p class="hotel-place">
                        ${UI.icon('pin')}
                        ${UI.escapeHtml(hotel.wishlistName || criteria.destination || 'Location not given')}
                        ${extra.distance ? `<span class="muted">- ${UI.escapeHtml(extra.distance)}</span>` : ''}
                    </p>
                    ${extra.room ? `
                        <p class="result-room">${UI.icon('bed')} ${UI.escapeHtml(extra.room)}</p>` : ''}
                    ${features.length ? `
                        <div class="result-features">
                            ${features.map(feature => `<span class="feature">${UI.icon(feature.icon)} ${UI.escapeHtml(feature.label)}</span>`).join('')}
                        </div>` : ''}
                </div>

                <div class="result-side">
                    ${rating > 0 ? `
                        <div class="result-rating">
                            <div>
                                <strong>${UI.escapeHtml(hotel.reviewScoreWord || UI.ratingWord(rating))}</strong>
                                <span>${UI.num(hotel.reviewCount || 0)} reviews</span>
                            </div>
                            <span class="rating ${UI.ratingClass(rating)}">${rating.toFixed(1)}</span>
                        </div>` : '<span class="label label-outline">No reviews yet</span>'}

                    <div style="width:100%">
                        <div class="price">
                            ${oldPrice ? `<div class="price-old">${UI.money(oldPrice, currency)}</div>` : ''}
                            <div class="price-new">${UI.money(price, currency)}</div>
                            <div class="price-per">per night, ${UI.money(price * nights, currency)} total</div>
                        </div>
                        <a class="btn btn-main btn-small btn-wide" href="${link}" style="margin-top:10px">View hotel</a>
                    </div>
                </div>
            </article>`;
    }

    /* ---------- filtering and sorting ---------- */
    function countActiveFilters() {
        let count = filters.stars.size + filters.features.size;
        if (filters.minRating) count += 1;
        if (filters.maxPrice !== null && filters.maxPrice < Math.ceil(dearest)) count += 1;
        if (filters.name) count += 1;
        return count;
    }

    function applyFilters() {
        const name = filters.name.trim().toLowerCase();

        shownHotels = allHotels.filter(item => {
            if (filters.stars.size && !filters.stars.has(starsOf(item))) return false;
            if (filters.minRating && ratingOf(item) < filters.minRating) return false;

            if (filters.maxPrice !== null) {
                const price = priceOf(item);
                // A price of 0 means "no price given", not free, so keep those.
                if (price > 0 && price > filters.maxPrice) return false;
            }

            if (filters.features.size) {
                const keys = featuresOf(item).map(feature => feature.key);
                for (const needed of filters.features) {
                    if (!keys.includes(needed)) return false;
                }
            }

            if (name) {
                const hotelName = String((item.property || {}).name || '').toLowerCase();
                const city = String((item.property || {}).wishlistName || '').toLowerCase();
                if (!hotelName.includes(name) && !city.includes(name)) return false;
            }

            return true;
        });

        sortResults(document.getElementById('sort').value);
        visibleCount = PAGE_SIZE;
        drawResults();
        drawTags();
        updateFilterCount();
    }

    function sortResults(mode) {
        if (mode === 'price_low') {
            // Hotels without a price go last instead of first.
            shownHotels.sort((a, b) => (priceOf(a) || Infinity) - (priceOf(b) || Infinity));
        } else if (mode === 'price_high') {
            shownHotels.sort((a, b) => priceOf(b) - priceOf(a));
        } else if (mode === 'rating') {
            shownHotels.sort((a, b) => ratingOf(b) - ratingOf(a));
        } else if (mode === 'stars') {
            shownHotels.sort((a, b) => starsOf(b) - starsOf(a));
        } else {
            // Back to the order the API sent, which allHotels still has.
            const order = new Map(allHotels.map((item, index) => [item, index]));
            shownHotels.sort((a, b) => order.get(a) - order.get(b));
        }
    }

    function drawResults() {
        const list = document.getElementById('results-list');
        const count = document.getElementById('results-count');
        const note = document.getElementById('results-note');
        const moreRow = document.getElementById('more-row');

        document.getElementById('popup-count').textContent = String(shownHotels.length);

        if (!allHotels.length) return; // an error message is already on screen

        if (!shownHotels.length) {
            count.textContent = 'No matches';
            note.textContent = '';
            moreRow.classList.add('hidden');
            list.classList.remove('grid-view');
            list.innerHTML = `
                <div class="notice">
                    <h3>No hotels match your filters</h3>
                    <p>
                        There are ${allHotels.length} hotels in ${UI.escapeHtml(criteria.destination || 'this city')},
                        but none match every filter. Try removing one.
                    </p>
                    <button class="btn btn-main" type="button" data-reset>Reset filters</button>
                </div>`;
            return;
        }

        const nights = UI.countNights(criteria.checkin, criteria.checkout) || 1;
        count.textContent = `${UI.num(shownHotels.length)} ${shownHotels.length === 1 ? 'hotel' : 'hotels'} found`;
        note.textContent = `${criteria.destination || 'Your destination'}, ${UI.plural(nights, 'night')}`;

        list.innerHTML = shownHotels.slice(0, visibleCount).map(resultHtml).join('');
        moreRow.classList.toggle('hidden', visibleCount >= shownHotels.length);
        document.getElementById('show-more').textContent =
            `Show ${Math.min(PAGE_SIZE, shownHotels.length - visibleCount)} more`;

        UI.markSavedButtons(list);
    }

    function drawTags() {
        const row = document.getElementById('tag-row');
        const tags = [];

        if (filters.name) tags.push({ label: `"${filters.name}"`, type: 'name' });
        if (filters.minRating) tags.push({ label: `Rating ${filters.minRating}+`, type: 'rating' });
        if (filters.maxPrice !== null && filters.maxPrice < Math.ceil(dearest)) {
            tags.push({ label: `Under ${UI.money(filters.maxPrice)}`, type: 'price' });
        }
        Array.from(filters.stars).sort().forEach(stars => {
            tags.push({ label: `${stars} star`, type: 'star', value: stars });
        });
        Array.from(filters.features).forEach(key => {
            const feature = FEATURES.find(item => item.key === key);
            tags.push({ label: feature ? feature.label : key, type: 'feature', value: key });
        });

        row.classList.toggle('hidden', tags.length === 0);
        if (!tags.length) {
            row.innerHTML = '';
            return;
        }

        row.innerHTML = tags.map(tag => `
            <span class="tag">
                ${UI.escapeHtml(tag.label)}
                <button type="button" data-tag-type="${tag.type}" data-tag-value="${UI.escapeHtml(String(tag.value || ''))}"
                        aria-label="Remove filter ${UI.escapeHtml(tag.label)}">
                    ${UI.icon('close')}
                </button>
            </span>`).join('') +
            `<button class="btn btn-plain btn-small" type="button" data-reset>Clear all</button>`;
    }

    function updateFilterCount() {
        const count = countActiveFilters();
        const label = document.getElementById('filter-count');
        label.textContent = count ? String(count) : '';
        label.classList.toggle('hidden', count === 0);
    }

    function resetFilters() {
        filters.stars.clear();
        filters.features.clear();
        filters.minRating = 0;
        filters.maxPrice = null;
        filters.name = '';
        drawFilters();
        applyFilters();
    }

    /* ---------- filter events ---------- */
    const priceChanged = UI.debounce(() => { applyFilters(); copyPriceToOtherPanel(); }, 220);
    const nameChanged = UI.debounce(() => { applyFilters(); copyNameToOtherPanel(); }, 260);

    function watchFilterPanel(panel) {
        panel.addEventListener('change', event => {
            const input = event.target;

            if (input.dataset.star) {
                const stars = Number(input.dataset.star);
                if (input.checked) filters.stars.add(stars); else filters.stars.delete(stars);
            } else if (input.dataset.feature) {
                if (input.checked) filters.features.add(input.dataset.feature);
                else filters.features.delete(input.dataset.feature);
            } else if (input.type === 'radio') {
                filters.minRating = Number(input.value);
            } else {
                return;
            }

            copyCheckboxesToOtherPanel(panel);
            applyFilters();
        });

        panel.addEventListener('input', event => {
            if (event.target.classList.contains('price-filter')) {
                filters.maxPrice = Number(event.target.value);
                const label = panel.querySelector('.price-label');
                if (label) label.textContent = `Up to ${UI.money(filters.maxPrice)}`;
                priceChanged();
            }
            if (event.target.classList.contains('name-filter')) {
                filters.name = event.target.value;
                nameChanged();
            }
        });

        panel.addEventListener('click', event => {
            if (event.target.closest('[data-reset]')) resetFilters();
        });
    }

    // The sidebar and the popup hold the same controls, so a change in one is copied to the other.
    function otherPanel(panel) {
        return panel.id === 'filters'
            ? document.getElementById('filters-popup')
            : document.getElementById('filters');
    }

    function copyCheckboxesToOtherPanel(panel) {
        const other = otherPanel(panel);
        other.querySelectorAll('[data-star]').forEach(input => {
            input.checked = filters.stars.has(Number(input.dataset.star));
        });
        other.querySelectorAll('[data-feature]').forEach(input => {
            input.checked = filters.features.has(input.dataset.feature);
        });
        other.querySelectorAll('input[type="radio"]').forEach(input => {
            input.checked = Number(input.value) === filters.minRating;
        });
    }

    function copyPriceToOtherPanel() {
        document.querySelectorAll('.price-filter').forEach(input => {
            if (filters.maxPrice !== null) input.value = filters.maxPrice;
        });
        document.querySelectorAll('.price-label').forEach(label => {
            label.textContent = `Up to ${UI.money(filters.maxPrice === null ? dearest : filters.maxPrice)}`;
        });
    }

    function copyNameToOtherPanel() {
        document.querySelectorAll('.name-filter').forEach(input => {
            if (input.value !== filters.name) input.value = filters.name;
        });
    }

    // The "no matches" notice is drawn inside the results list, so its reset
    // button needs its own delegate.
    document.getElementById('results-list').addEventListener('click', event => {
        if (event.target.closest('[data-reset]')) resetFilters();
    });

    document.getElementById('tag-row').addEventListener('click', event => {
        if (event.target.closest('[data-reset]')) {
            resetFilters();
            return;
        }

        const button = event.target.closest('[data-tag-type]');
        if (!button) return;

        const type = button.dataset.tagType;
        const value = button.dataset.tagValue;

        if (type === 'name') filters.name = '';
        else if (type === 'rating') filters.minRating = 0;
        else if (type === 'price') filters.maxPrice = null;
        else if (type === 'star') filters.stars.delete(Number(value));
        else if (type === 'feature') filters.features.delete(value);

        drawFilters();
        applyFilters();
    });

    /* ---------- toolbar ---------- */
    document.getElementById('sort').addEventListener('change', event => {
        sortResults(event.target.value);
        visibleCount = PAGE_SIZE;
        drawResults();
    });

    document.getElementById('show-more').addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        drawResults();
    });

    const listButton = document.getElementById('view-list');
    const gridButton = document.getElementById('view-grid');

    function setView(mode) {
        document.getElementById('results-list').classList.toggle('grid-view', mode === 'grid');
        listButton.setAttribute('aria-pressed', String(mode === 'list'));
        gridButton.setAttribute('aria-pressed', String(mode === 'grid'));
        UI.save('view_mode', mode);
    }

    listButton.addEventListener('click', () => setView('list'));
    gridButton.addEventListener('click', () => setView('grid'));

    /* ---------- filter popup ---------- */
    const filterPopup = UI.makePopup(document.getElementById('filter-popup'));
    document.getElementById('open-filters').addEventListener('click', filterPopup.open);
    document.getElementById('popup-reset').addEventListener('click', resetFilters);

    /* ---------- change search ---------- */
    const changeForm = document.getElementById('change-form');
    const changeButton = document.getElementById('change-btn');
    const destinationInput = document.getElementById('destination');
    const suggestionBox = document.getElementById('suggestions');

    let chosenDestination = null;
    let suggestions = [];
    let highlighted = -1;
    let pickersStarted = false;

    changeButton.addEventListener('click', () => {
        const open = !changeForm.classList.toggle('hidden');
        changeButton.setAttribute('aria-expanded', String(open));
        if (!open) return;
        if (!pickersStarted) {
            startDatePickers();
            pickersStarted = true;
        }
        destinationInput.focus();
    });

    function startDatePickers() {
        const checkoutPicker = flatpickr('#checkout', {
            minDate: UI.addDays(criteria.checkin, 1),
            defaultDate: criteria.checkout,
            dateFormat: 'Y-m-d',
            altInput: true,
            altFormat: 'D, M j'
        });

        flatpickr('#checkin', {
            minDate: 'today',
            defaultDate: criteria.checkin,
            dateFormat: 'Y-m-d',
            altInput: true,
            altFormat: 'D, M j',
            onChange(dates) {
                if (!dates.length) return;
                const earliestCheckout = UI.addDays(dates[0], 1);
                checkoutPicker.set('minDate', earliestCheckout);
                if (UI.countNights(UI.isoDate(dates[0]), checkoutPicker.input.value) < 1) {
                    checkoutPicker.setDate(earliestCheckout, true);
                }
            }
        });
    }

    function suggestionIcon(type) {
        if (type === 'city') return 'city';
        if (type === 'hotel') return 'hotel';
        return 'pin';
    }

    function showSuggestions(results, query) {
        suggestions = results;
        highlighted = -1;

        if (!results.length) {
            suggestionBox.innerHTML = `
                <div class="suggestion">
                    <span class="suggestion-text">
                        <span class="suggestion-name">No matches for "${UI.escapeHtml(query)}"</span>
                    </span>
                </div>`;
        } else {
            suggestionBox.innerHTML = results.map((result, index) => {
                const place = result.label || [result.city_name, result.country].filter(Boolean).join(', ');
                return `
                    <button class="suggestion" type="button" role="option" aria-selected="false" data-index="${index}">
                        ${UI.icon(suggestionIcon(result.search_type))}
                        <span class="suggestion-text">
                            <span class="suggestion-name">${UI.escapeHtml(result.name)}</span>
                            <span class="suggestion-place">${UI.escapeHtml(place)}</span>
                        </span>
                    </button>`;
            }).join('');
        }

        suggestionBox.classList.add('open');
        destinationInput.setAttribute('aria-expanded', 'true');
    }

    function closeSuggestions() {
        suggestionBox.classList.remove('open');
        destinationInput.setAttribute('aria-expanded', 'false');
        highlighted = -1;
    }

    function highlight(index) {
        const options = Array.from(suggestionBox.querySelectorAll('.suggestion[data-index]'));
        if (!options.length) return;
        highlighted = (index + options.length) % options.length;
        options.forEach((option, i) => {
            option.classList.toggle('active', i === highlighted);
            option.setAttribute('aria-selected', String(i === highlighted));
        });
    }

    function pickSuggestion(index) {
        const result = suggestions[index];
        if (!result) return;
        chosenDestination = { dest_id: result.city_ufi || result.dest_id, name: result.name };
        destinationInput.value = result.name;
        UI.showFieldError(destinationInput, '');
        closeSuggestions();
    }

    const lookUpDestination = UI.debounce(async function (query) {
        try {
            const response = await searchService.searchDestination(query);
            if (destinationInput.value.trim() !== query) return;
            const results = (response && Array.isArray(response.data) ? response.data : [])
                .filter(item => item.search_type !== 'landmark')
                .filter(item => item.city_ufi || item.dest_id)
                .slice(0, 8);
            showSuggestions(results, query);
        } catch (error) {
            closeSuggestions();
        }
    }, 320);

    destinationInput.addEventListener('input', function () {
        chosenDestination = null;
        const query = this.value.trim();
        if (query.length < 2) {
            closeSuggestions();
            return;
        }
        suggestionBox.innerHTML = `
            <div class="suggestion">
                <span class="spinner"></span>
                <span class="suggestion-text"><span class="suggestion-name">Searching...</span></span>
            </div>`;
        suggestionBox.classList.add('open');
        lookUpDestination(query);
    });

    destinationInput.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown') { event.preventDefault(); highlight(highlighted + 1); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); highlight(highlighted - 1); }
        else if (event.key === 'Enter' && highlighted >= 0) { event.preventDefault(); pickSuggestion(highlighted); }
        else if (event.key === 'Escape') closeSuggestions();
    });

    suggestionBox.addEventListener('click', event => {
        const option = event.target.closest('.suggestion[data-index]');
        if (option) pickSuggestion(Number(option.dataset.index));
    });

    document.addEventListener('click', event => {
        if (!suggestionBox.contains(event.target) && event.target !== destinationInput) closeSuggestions();
    });

    changeForm.addEventListener('submit', function (event) {
        event.preventDefault();

        // If the destination was not changed, keep the current one and just use the new dates.
        const destination = chosenDestination || { dest_id: criteria.dest_id, name: criteria.destination };

        if (!destination.dest_id) {
            UI.showFieldError(destinationInput, 'Choose a destination from the suggestion list.');
            destinationInput.focus();
            return;
        }

        const checkin = document.getElementById('checkin').value || criteria.checkin;
        const checkout = document.getElementById('checkout').value || criteria.checkout;
        const adults = Number(document.getElementById('guests').value) || criteria.adults;

        UI.search.write({ checkin, checkout, adults });
        UI.recentSearches.add({ dest_id: destination.dest_id, name: destination.name });

        const query = UI.search.toQuery({ dest_id: destination.dest_id, destination: destination.name });
        document.getElementById('change-submit').disabled = true;
        window.location.href = `search-results.html?${query.toString()}`;
    });

    /* ---------- summary bar ---------- */
    function drawSummary() {
        const summary = UI.search.describe(criteria);
        document.getElementById('summary-city').textContent = criteria.destination || 'Your destination';
        document.getElementById('summary-dates').textContent = summary.dates;
        document.getElementById('summary-nights').textContent = `(${summary.nightsText})`;
        document.getElementById('summary-guests').textContent = summary.guests;

        destinationInput.value = criteria.destination || '';
        document.getElementById('guests').value = String(Math.min(6, criteria.adults));
        document.title = `Hotels in ${criteria.destination || 'your destination'} - guestbridgerwanda`;
    }

    /* ---------- load results ---------- */
    async function loadResults() {
        const list = document.getElementById('results-list');
        list.innerHTML = '<div class="loading"><span class="spinner"></span> Searching hotels...</div>';
        document.getElementById('results-count').textContent = 'Searching...';

        if (!criteria.dest_id) {
            document.getElementById('results-count').textContent = 'No destination';
            list.innerHTML = `
                <div class="notice">
                    <h3>Choose a destination first</h3>
                    <p>We need to know which city to search before we can show any hotels.</p>
                    <a class="btn btn-main" href="index.html">Start a search</a>
                </div>`;
            return;
        }

        try {
            const response = await searchService.searchHotels(criteria.dest_id, {
                arrival_date: criteria.checkin,
                departure_date: criteria.checkout,
                adults: criteria.adults,
                children_age: criteria.children > 0 ? Array(criteria.children).fill('8').join(',') : '',
                room_qty: criteria.rooms,
                page_number: 1,
                currency_code: 'USD'
            });

            const hotels = response && response.data && Array.isArray(response.data.hotels)
                ? response.data.hotels : [];

            if (!hotels.length) {
                document.getElementById('results-count').textContent = 'Nothing available';
                list.innerHTML = `
                    <div class="notice">
                        <h3>No hotels available for these dates</h3>
                        <p>
                            Nothing in ${UI.escapeHtml(criteria.destination || 'this city')} can be booked for
                            ${UI.escapeHtml(UI.search.describe(criteria).dates)}. Try different dates.
                        </p>
                        <button class="btn btn-main" type="button" id="empty-change">Change dates</button>
                    </div>`;
                const changeDates = document.getElementById('empty-change');
                if (changeDates) changeDates.addEventListener('click', () => changeButton.click());
                return;
            }

            allHotels = hotels;

            const prices = hotels.map(priceOf).filter(price => price > 0);
            cheapest = prices.length ? Math.floor(Math.min.apply(null, prices)) : 0;
            dearest = prices.length ? Math.ceil(Math.max.apply(null, prices)) : 1000;
            if (dearest <= cheapest) dearest = cheapest + 100;

            drawFilters();
            watchFilterPanel(document.getElementById('filters'));
            watchFilterPanel(document.getElementById('filters-popup'));
            applyFilters();
        } catch (error) {
            document.getElementById('results-count').textContent = 'Search failed';
            list.innerHTML = `
                <div class="notice notice-error">
                    <h3>Could not load hotels</h3>
                    <p>${UI.escapeHtml(error.message || 'The API did not respond.')}</p>
                    <div class="row" style="justify-content:center">
                        <button class="btn btn-main" type="button" id="retry">Try again</button>
                        <a class="btn btn-outline" href="index.html">New search</a>
                    </div>
                </div>`;
            const retry = document.getElementById('retry');
            if (retry) retry.addEventListener('click', loadResults);
        }
    }

    /* ---------- start ---------- */
    document.getElementById('year').textContent = new Date().getFullYear();
    setView(UI.load('view_mode', 'list') === 'grid' ? 'grid' : 'list');
    drawSummary();
    loadResults();
})();
</script>
</body>
</html>
